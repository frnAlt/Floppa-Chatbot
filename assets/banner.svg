<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0d1127"/>
      <stop offset="100%" stop-color="#050711"/>
    </linearGradient>

    <!-- Animated Neon Linear Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#4facfe;#ff007f;#7928ca;#00ff87;#00f2fe" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ff007f">
        <animate attributeName="stop-color" values="#ff007f;#7928ca;#00ff87;#00f2fe;#4facfe;#ff007f" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00ff87">
        <animate attributeName="stop-color" values="#00ff87;#00f2fe;#4facfe;#ff007f;#7928ca;#00ff87" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Secondary Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.05)" stroke-width="1"/>
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes floatOpposite {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-2deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }
      @keyframes waveSlide {
        0% { transform: translateX(0); }
        50% { transform: translateX(-60px); }
        100% { transform: translateX(0); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes textShine {
        0% { fill-opacity: 0.85; }
        50% { fill-opacity: 1; filter: drop-shadow(0 0 15px #00f2fe); }
        100% { fill-opacity: 0.85; }
      }
      @keyframes orbTravel {
        0% { transform: translate(0, 0); }
        25% { transform: translate(180px, 40px); }
        50% { transform: translate(320px, -20px); }
        75% { transform: translate(140px, 60px); }
        100% { transform: translate(0, 0); }
      }
      @keyframes orbTravel2 {
        0% { transform: translate(0, 0); }
        25% { transform: translate(-140px, -30px); }
        50% { transform: translate(-260px, 50px); }
        75% { transform: translate(-80px, -20px); }
        100% { transform: translate(0, 0); }
      }
      @keyframes badgeBlink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }

      .floating-cat {
        animation: floatSlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .wave-layer1 {
        animation: waveSlide 10s ease-in-out infinite;
      }
      .glow-orb-1 {
        animation: orbTravel 14s ease-in-out infinite, pulseGlow 5s ease-in-out infinite;
      }
      .glow-orb-2 {
        animation: orbTravel2 16s ease-in-out infinite, pulseGlow 6s ease-in-out infinite;
      }
      .title-text {
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 5px;
        animation: textShine 4s ease-in-out infinite;
      }
      .status-dot {
        animation: badgeBlink 2s ease-in-out infinite;
      }
      .badge-box {
        transition: all 0.3s ease;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" rx="20"/>

  <!-- Tech Grid Background -->
  <rect width="100%" height="100%" fill="url(#grid)" rx="20"/>

  <!-- Ambient Light Orbs -->
  <g filter="url(#softGlow)">
    <circle class="glow-orb-1" cx="220" cy="140" r="140" fill="#00f2fe" opacity="0.18"/>
    <circle class="glow-orb-2" cx="980" cy="260" r="160" fill="#ff007f" opacity="0.16"/>
    <circle cx="600" cy="200" r="120" fill="#7928ca" opacity="0.14">
      <animate attributeName="opacity" values="0.10;0.22;0.10" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Animated Wave Lines (Bottom Ambient) -->
  <g opacity="0.35" class="wave-layer1">
    <path d="M-100,340 C250,300 450,400 800,320 C1000,270 1150,370 1350,330 L1350,420 L-100,420 Z" fill="url(#accentGrad)" opacity="0.15"/>
    <path d="M-100,360 C200,320 500,410 850,350 C1050,310 1200,390 1350,360" fill="none" stroke="url(#neonGradient)" stroke-width="2.5" filter="url(#glow)"/>
    <path d="M-100,380 C150,350 450,420 750,370 C1000,330 1180,410 1350,380" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Outer Neon Border Frame -->
  <rect x="2" y="2" width="1196" height="416" rx="18" fill="none" stroke="url(#neonGradient)" stroke-width="2.5" opacity="0.85" filter="url(#glow)"/>
  <rect x="8" y="8" width="1184" height="404" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>

  <!-- Top Status Badge -->
  <g transform="translate(430, 35)">
    <rect x="0" y="0" width="340" height="34" rx="17" fill="rgba(13, 17, 39, 0.85)" stroke="url(#neonGradient)" stroke-width="1.2"/>
    <circle class="status-dot" cx="22" cy="17" r="5" fill="#00ff87" filter="url(#glow)"/>
    <text x="36" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
      24/7 ONLINE • ADVANCED ENGINE
    </text>
  </g>

  <!-- Left Icon Mascot / Cyber Floppa Emblem -->
  <g class="floating-cat" transform="translate(100, 110)">
    <!-- Shield / Emblem Halo -->
    <circle cx="95" cy="95" r="92" fill="none" stroke="url(#neonGradient)" stroke-width="2" stroke-dasharray="10 6" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 95 95" to="360 95 95" dur="25s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="95" r="80" fill="rgba(13, 17, 39, 0.9)" stroke="rgba(0, 242, 254, 0.5)" stroke-width="1.5"/>

    <!-- Floppa Stylized Face Vector -->
    <g transform="translate(45, 45)">
      <!-- Ears -->
      <polygon points="12,45 0,0 42,28" fill="#e0a96d" stroke="#ff007f" stroke-width="2"/>
      <polygon points="88,45 100,0 58,28" fill="#e0a96d" stroke="#ff007f" stroke-width="2"/>
      <!-- Tuft Hair at ear tips -->
      <line x1="0" y1="0" x2="-8" y2="-12" stroke="#111" stroke-width="3"/>
      <line x1="100" y1="0" x2="108" y2="-12" stroke="#111" stroke-width="3"/>
      
      <!-- Head Base -->
      <ellipse cx="50" cy="58" rx="46" ry="38" fill="#c68b59" stroke="#00f2fe" stroke-width="1.5"/>
      <!-- Muzzle -->
      <ellipse cx="50" cy="70" rx="26" ry="18" fill="#f5ede0"/>
      <!-- Nose -->
      <polygon points="50,65 44,58 56,58" fill="#2d1303"/>
      <!-- Eyes Cyber Glasses -->
      <rect x="20" y="44" width="24" height="12" rx="4" fill="#070913" stroke="#00f2fe" stroke-width="2"/>
      <rect x="56" y="44" width="24" height="12" rx="4" fill="#070913" stroke="#00f2fe" stroke-width="2"/>
      <circle cx="32" cy="50" r="3" fill="#00ff87" filter="url(#glow)"/>
      <circle cx="68" cy="50" r="3" fill="#00ff87" filter="url(#glow)"/>
      <!-- Mouth -->
      <path d="M 42 74 Q 50 82 58 74" fill="none" stroke="#2d1303" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Whiskers -->
      <line x1="22" y1="68" x2="2" y2="65" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
      <line x1="22" y1="73" x2="4" y2="76" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
      <line x1="78" y1="68" x2="98" y2="65" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
      <line x1="78" y1="73" x2="96" y2="76" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
    </g>
  </g>

  <!-- Central Typography -->
  <g transform="translate(340, 155)">
    <!-- Subtitle Pill -->
    <text x="0" y="0" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="3">
      NEXT-GEN FACEBOOK MESSENGER BOT
    </text>

    <!-- Main Title -->
    <text class="title-text" x="0" y="55" fill="url(#neonGradient)" font-size="52" filter="url(#glow)">
      FLOPPA CHATBOT
    </text>

    <!-- Tagline Description -->
    <text x="0" y="95" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="0.5">
      Ultra-Resilient Messenger Engine • Metachat Native FCA • Multi-LLM AI Core
    </text>

    <!-- Developer Credits Line -->
    <g transform="translate(0, 125)">
      <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600">
        Created &amp; Maintained by <tspan fill="#ff007f" font-weight="700">frnAlt</tspan> &amp; <tspan fill="#00f2fe" font-weight="700">Gtajisan (Farhan Muh Tasim)</tspan>
      </text>
    </g>
  </g>

  <!-- Feature Pills / Badges (Bottom Row) -->
  <g transform="translate(340, 320)">
    <!-- Badge 1 -->
    <g class="badge-box" transform="translate(0, 0)">
      <rect width="180" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.2"/>
      <text x="90" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
        ⚡ 350+ Commands
      </text>
    </g>

    <!-- Badge 2 -->
    <g class="badge-box" transform="translate(195, 0)">
      <rect width="190" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 0, 127, 0.4)" stroke-width="1.2"/>
      <text x="95" y="24" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
        🧠 11+ AI Providers
      </text>
    </g>

    <!-- Badge 3 -->
    <g class="badge-box" transform="translate(400, 0)">
      <rect width="200" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 255, 135, 0.4)" stroke-width="1.2"/>
      <text x="100" y="24" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
        🛡️ Anti-Ban FCA V5
      </text>
    </g>

    <!-- Badge 4 -->
    <g class="badge-box" transform="translate(615, 0)">
      <rect width="180" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.2"/>
      <text x="90" y="24" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
        🚀 Multi-Account
      </text>
    </g>
  </g>

  <!-- Top Right Cyber Decorative Element -->
  <g transform="translate(1080, 40)" opacity="0.7">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="6 4">
      <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="20" r="6" fill="#ff007f" filter="url(#glow)"/>
  </g>
</svg>