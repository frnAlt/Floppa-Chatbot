name: Goat / Floppa Bot Runner

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version'
        required: false
        type: choice
        options:
          - '22'
          - '20'
        default: '22'

jobs:
  build-and-run:
    name: Run Floppa Bot Runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version || '22' }}

      - name: Install System Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm install && npm rebuild sqlite3 canvas bcrypt

      - name: Configure Credentials If Provided
        env:
          FB_STATE: ${{ secrets.FB_STATE }}
          ACCOUNT_TXT: ${{ secrets.ACCOUNT_TXT }}
        run: |
          if [ -n "$FB_STATE" ]; then
            echo "$FB_STATE" > account.txt
            echo "Loaded Facebook account from FB_STATE secret."
          elif [ -n "$ACCOUNT_TXT" ]; then
            echo "$ACCOUNT_TXT" > account.txt
            echo "Loaded Facebook account from ACCOUNT_TXT secret."
          fi

      - name: Start the Bot
        env:
          PORT: 5000
          NODE_ENV: production
        run: npm start
