name: Goat / Floppa Bot Runner

on:
  workflow_dispatch:
    inputs:
      cookie:
        description: 'Facebook Cookie / Appstate JSON / Cookie String (Overrides account.json / account.txt & secrets)'
        required: false
        type: string
        default: ''
      cookie2:
        description: 'Secondary Cookie / Appstate for account2.json / account2.txt (Optional multi-account backup)'
        required: false
        type: string
        default: ''
      node_version:
        description: 'Node.js version'
        required: false
        type: choice
        options:
          - '24'
          - '26'
          - '22'
          - '20'
        default: '24'

jobs:
  build-and-run:
    name: Run Floppa Bot Runner
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version || '24' }}

      - name: Install System Native Build Dependencies
        timeout-minutes: 5
        continue-on-error: true
        run: |
          # Configure APT timeouts to prevent indefinite hanging on stalled connections
          sudo mkdir -p /etc/apt/apt.conf.d
          printf 'Acquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "3";\nAcquire::http::Pipeline-Depth "0";\n' | sudo tee /etc/apt/apt.conf.d/99custom-timeouts.conf > /dev/null

          # Switch from flaky Azure mirrors to canonical Ubuntu archive mirrors
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com|http://archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo sed -i 's|http://.*\.archive\.ubuntu\.com|http://archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt 2>/dev/null || true

          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y -q || true
          sudo apt-get install -y -q --no-install-recommends \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev || true

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm install --include=optional && (npm rebuild sqlite3 canvas bcrypt 2>/dev/null || true)

      - name: Configure Credentials If Provided
        env:
          INPUT_COOKIE: ${{ inputs.cookie }}
          INPUT_COOKIE2: ${{ inputs.cookie2 }}
          FB_STATE: ${{ secrets.FB_STATE }}
          ACCOUNT_TXT: ${{ secrets.ACCOUNT_TXT }}
          FB_STATE_2: ${{ secrets.FB_STATE_2 }}
          ACCOUNT2_TXT: ${{ secrets.ACCOUNT2_TXT }}
        run: |
          mask_and_save() {
            local content="$1"
            local target_file="$2"
            local label="$3"

            if [ -z "$content" ]; then
              return 0
            fi

            # Mask sensitive credential values to prevent leakage in workflow logs
            for val in $(echo "$content" | grep -oE '"value"\s*:\s*"[^"]+"' | sed -E 's/"value"\s*:\s*"([^"]+)"/\1/' 2>/dev/null); do
              if [ ${#val} -gt 5 ]; then
                echo "::add-mask::$val"
              fi
            done
            for pair in $(echo "$content" | grep -oE '(c_user|xs|fr|datr|sb)=[^;[:space:]]+' 2>/dev/null); do
              token="${pair#*=}"
              if [ ${#token} -gt 5 ]; then
                echo "::add-mask::$token"
              fi
            done

            # Check if base64 encoded and decode if applicable
            if echo "$content" | base64 -d >/dev/null 2>&1 && [[ "$content" =~ ^[A-Za-z0-9+/=]+$ ]] && [[ ! "$content" =~ "c_user" ]] && echo "$content" | base64 -d 2>/dev/null | grep -q '\[\|{'; then
              echo "$content" | base64 -d > "$target_file"
              echo "Decoded base64 $label credentials into $target_file."
            else
              printf '%s\n' "$content" > "$target_file"
              echo "Loaded $label credentials into $target_file."
            fi

            # Sync dual-format accounts (both .json and .txt)
            if [ "$target_file" = "account.json" ] || [ "$target_file" = "account.txt" ]; then
              cp -f "$target_file" "account.json" 2>/dev/null || true
              cp -f "$target_file" "account.txt" 2>/dev/null || true
            fi
            if [ "$target_file" = "account2.json" ] || [ "$target_file" = "account2.txt" ]; then
              cp -f "$target_file" "account2.json" 2>/dev/null || true
              cp -f "$target_file" "account2.txt" 2>/dev/null || true
            fi
          }

          # Primary account configuration (Workflow input takes precedence over secrets)
          if [ -n "$INPUT_COOKIE" ]; then
            mask_and_save "$INPUT_COOKIE" "account.json" "workflow input (cookie)"
          elif [ -n "$FB_STATE" ]; then
            mask_and_save "$FB_STATE" "account.json" "FB_STATE secret"
          elif [ -n "$ACCOUNT_TXT" ]; then
            mask_and_save "$ACCOUNT_TXT" "account.json" "ACCOUNT_TXT secret"
          fi

          # Ensure synchronization if either file was loaded or pre-exists
          if [ -s "account.json" ] && [ ! -s "account.txt" ]; then cp -f "account.json" "account.txt"; fi
          if [ -s "account.txt" ] && [ ! -s "account.json" ]; then cp -f "account.txt" "account.json"; fi

          if [ -s "account.json" ] || [ -s "account.txt" ]; then
            echo "Primary credentials are ready (account.json: $(wc -c < account.json 2>/dev/null || echo 0) bytes, account.txt: $(wc -c < account.txt 2>/dev/null || echo 0) bytes)"
          else
            echo "Primary credentials fallback will be loaded from repository if present."
          fi

          # Secondary account configuration (if provided)
          if [ -n "$INPUT_COOKIE2" ]; then
            mask_and_save "$INPUT_COOKIE2" "account2.json" "workflow input (cookie2)"
          elif [ -n "$FB_STATE_2" ]; then
            mask_and_save "$FB_STATE_2" "account2.json" "FB_STATE_2 secret"
          elif [ -n "$ACCOUNT2_TXT" ]; then
            mask_and_save "$ACCOUNT2_TXT" "account2.json" "ACCOUNT2_TXT secret"
          fi

          if [ -s "account2.json" ] && [ ! -s "account2.txt" ]; then cp -f "account2.json" "account2.txt"; fi
          if [ -s "account2.txt" ] && [ ! -s "account2.json" ]; then cp -f "account2.txt" "account2.json"; fi

          if [ -s "account2.json" ] || [ -s "account2.txt" ]; then
            echo "Secondary credentials are ready (account2.json: $(wc -c < account2.json 2>/dev/null || echo 0) bytes, account2.txt: $(wc -c < account2.txt 2>/dev/null || echo 0) bytes)"
          fi

      - name: Start the Bot
        env:
          PORT: 5000
          NODE_ENV: production
          FORCE_COLOR: '1'
          COOKIES: ${{ inputs.cookie || secrets.FB_STATE || secrets.ACCOUNT_TXT }}
          FB_STATE: ${{ inputs.cookie || secrets.FB_STATE }}
          ACCOUNT_TXT: ${{ secrets.ACCOUNT_TXT }}
        run: npm start
