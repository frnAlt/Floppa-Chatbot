name: Goat / Floppa Bot Runner

on:
  workflow_dispatch:
    inputs:
      cookie:
        description: 'Facebook Cookie / Appstate JSON / Cookie String (Overrides account.txt & secrets)'
        required: false
        type: string
        default: ''
      cookie2:
        description: 'Secondary Cookie / Appstate for account2.txt (Optional multi-account backup)'
        required: false
        type: string
        default: ''
      node_version:
        description: 'Node.js version'
        required: false
        type: choice
        options:
          - '24'
          - '26'
          - '22'
          - '20'
        default: '24'

jobs:
  build-and-run:
    name: Run Floppa Bot Runner
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version || '24' }}

      - name: Install System Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm install --include=optional && (npm rebuild sqlite3 canvas bcrypt 2>/dev/null || true)

      - name: Configure Credentials If Provided
        env:
          INPUT_COOKIE: ${{ inputs.cookie }}
          INPUT_COOKIE2: ${{ inputs.cookie2 }}
          FB_STATE: ${{ secrets.FB_STATE }}
          ACCOUNT_TXT: ${{ secrets.ACCOUNT_TXT }}
          FB_STATE_2: ${{ secrets.FB_STATE_2 }}
          ACCOUNT2_TXT: ${{ secrets.ACCOUNT2_TXT }}
        run: |
          mask_and_save() {
            local content="$1"
            local target_file="$2"
            local label="$3"

            if [ -z "$content" ]; then
              return 0
            fi

            # Mask sensitive credential lines to prevent leakage in workflow logs
            while IFS= read -r line; do
              if [ ${#line} -gt 6 ]; then
                echo "::add-mask::$line"
              fi
            done <<< "$content"

            # Check if base64 encoded and decode if applicable
            if echo "$content" | base64 -d >/dev/null 2>&1 && [[ "$content" =~ ^[A-Za-z0-9+/=]+$ ]] && [[ ! "$content" =~ "c_user" ]] && echo "$content" | base64 -d 2>/dev/null | grep -q '\[\|{'; then
              echo "$content" | base64 -d > "$target_file"
              echo "Decoded base64 $label credentials into $target_file."
            else
              printf '%s\n' "$content" > "$target_file"
              echo "Loaded $label credentials into $target_file."
            fi
          }

          # Primary account configuration (Workflow input takes precedence over secrets)
          if [ -n "$INPUT_COOKIE" ]; then
            mask_and_save "$INPUT_COOKIE" "account.txt" "workflow input (cookie)"
          elif [ -n "$FB_STATE" ]; then
            mask_and_save "$FB_STATE" "account.txt" "FB_STATE secret"
          elif [ -n "$ACCOUNT_TXT" ]; then
            mask_and_save "$ACCOUNT_TXT" "account.txt" "ACCOUNT_TXT secret"
          fi

          if [ -s "account.txt" ]; then
            echo "Primary account.txt is ready ($(wc -c < account.txt) bytes)"
          else
            echo "account.txt fallback will be loaded from repository if present."
          fi

          # Secondary account configuration (if provided)
          if [ -n "$INPUT_COOKIE2" ]; then
            mask_and_save "$INPUT_COOKIE2" "account2.txt" "workflow input (cookie2)"
          elif [ -n "$FB_STATE_2" ]; then
            mask_and_save "$FB_STATE_2" "account2.txt" "FB_STATE_2 secret"
          elif [ -n "$ACCOUNT2_TXT" ]; then
            mask_and_save "$ACCOUNT2_TXT" "account2.txt" "ACCOUNT2_TXT secret"
          fi

          if [ -s "account2.txt" ]; then
            echo "Secondary account2.txt is ready ($(wc -c < account2.txt) bytes)"
          fi

      - name: Start the Bot
        env:
          PORT: 5000
          NODE_ENV: production
          FORCE_COLOR: '1'
          COOKIES: ${{ inputs.cookie || secrets.FB_STATE || secrets.ACCOUNT_TXT }}
          FB_STATE: ${{ inputs.cookie || secrets.FB_STATE }}
          ACCOUNT_TXT: ${{ secrets.ACCOUNT_TXT }}
        run: npm start
