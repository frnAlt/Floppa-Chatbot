name: Floppa-Chatbot CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version'
        required: false
        type: choice
        options:
          - '24'
          - '26'
          - '22'
          - '20'
        default: '24'
      run_syntax_checks:
        description: 'Run syntax check on core engine, commands and events'
        required: false
        type: boolean
        default: true
      run_full_diagnostics:
        description: 'Run full diagnostic test suite'
        required: false
        type: boolean
        default: true

jobs:
  test-and-validate:
    name: Build, Syntax & Diagnostic Verification
    runs-on: ubuntu-latest
    env:
      CI_TEST_MODE: 'true'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version || '24' }}

      - name: Install System Dependencies for Native Addons
        timeout-minutes: 5
        continue-on-error: true
        run: |
          # Configure APT timeouts to prevent indefinite hanging on stalled connections
          sudo mkdir -p /etc/apt/apt.conf.d
          printf 'Acquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "3";\nAcquire::http::Pipeline-Depth "0";\n' | sudo tee /etc/apt/apt.conf.d/99custom-timeouts.conf > /dev/null

          # Switch from flaky Azure mirrors to canonical Ubuntu archive mirrors
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com|http://archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo sed -i 's|http://.*\.archive\.ubuntu\.com|http://archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt 2>/dev/null || true

          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y -q || true
          sudo apt-get install -y -q --no-install-recommends \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev || true

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm install && (npm rebuild sqlite3 canvas bcrypt 2>/dev/null || true)

      - name: Core System Syntax Verification
        if: ${{ inputs.run_syntax_checks != false }}
        run: |
          node --check index.js Floppa.js Goat.js utils.js
          node --check logger/eventLogger.js logger/log.js logger/loading.js
          node --check bot/login/login.js bot/login/checkLiveCookie.js
          node --check bot/handler/handlerAction.js bot/handler/handlerEvents.js
          node --check dashboard/app.js dashboard/routes/api.js

      - name: All Commands Syntax Check
        if: ${{ inputs.run_syntax_checks != false }}
        run: for file in scripts/cmds/*.js; do node --check "$file"; done

      - name: All Events Syntax Check
        if: ${{ inputs.run_syntax_checks != false }}
        run: for file in scripts/events/*.js; do node --check "$file"; done

      - name: FCA Engine Unit Tests
        run: cd fca && npm test

      - name: Run Full Diagnostic Test Suite
        if: ${{ inputs.run_full_diagnostics != false }}
        run: node scripts/test_cli_runner.js
